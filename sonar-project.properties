# SonarCloud Configuration
# هذا الملف يخبر SonarCloud كيف يحلل مشروعك

# projectKey: معرف فريد للمشروع في SonarCloud
# الصيغة الصحيحة: {github_username}_{repo_name}
sonar.projectKey=yasir239_devsecops-demo

# organization: اسم الـ organization في SonarCloud (نفس الـ GitHub username عادةً)
sonar.organization=yasir239

# projectName: اسم يظهر في واجهة SonarCloud
sonar.projectName=DevSecOps Demo

# sources: المجلدات التي سيحللها SonarCloud
sonar.sources=.

# exclusions: ملفات ومجلدات نستثنيها من التحليل
# venv = مكتبات Python (ليست كودنا)
# tests = اختبارات (SonarCloud لها إعداد منفصل)
# __pycache__ = ملفات Python المُجمَّعة
sonar.exclusions=**/venv/**,**/__pycache__/**,**/htmlcov/**

# tests: مجلد الاختبارات (SonarCloud يتعامل معها بشكل خاص)
sonar.tests=tests

# إصدار Python
sonar.python.version=3.11

# coverage: ملف تقرير الـ coverage الذي ينتجه pytest-cov
# SonarCloud يقرأه لمعرفة نسبة الـ code coverage
sonar.python.coverage.reportPaths=coverage.xml
